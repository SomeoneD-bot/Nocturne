
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nocturne — Your world, your rules</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(ellipse at top, #38233f, transparent 60%),
        #100e16;
      color: #f8edf7;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 440px;
      background: rgba(29, 24, 37, 0.96);
      border: 1px solid #49354f;
      border-radius: 22px;
      padding: 35px;
      box-shadow: 0 20px 80px #0008;
    }

    .logo {
      text-align: center;
      color: #e6a3cb;
      font-size: 32px;
      letter-spacing: 6px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #a99bad;
      margin-bottom: 30px;
      font-size: 14px;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 25px;
    }

    .tabs button {
      flex: 1;
      padding: 12px;
      background: #292332;
      border: 1px solid #403449;
      color: #bcb0c2;
      border-radius: 9px;
      cursor: pointer;
    }

    .tabs button.active {
      background: #633b61;
      color: white;
      border-color: #bd78a8;
    }

    h2 {
      margin-bottom: 20px;
      font-size: 23px;
    }

    label {
      display: block;
      color: #d5c5d7;
      font-size: 13px;
      margin: 15px 0 7px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #46394e;
      border-radius: 9px;
      background: #17141e;
      color: white;
      outline: none;
    }

    input:focus {
      border-color: #cf85b5;
    }

    .submit {
      width: 100%;
      padding: 14px;
      margin-top: 24px;
      border: none;
      border-radius: 9px;
      background: #b96d9e;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .submit:hover {
      background: #d58ab9;
    }

    .forgot {
      display: block;
      text-align: right;
      color: #dc9bc5;
      margin-top: 13px;
      font-size: 13px;
      cursor: pointer;
    }

    .message {
      margin-top: 18px;
      padding: 12px;
      border-radius: 9px;
      background: #302638;
      color: #edc2dc;
      font-size: 13px;
      line-height: 1.5;
      display: none;
    }

    .hidden {
      display: none;
    }

    .footer {
      text-align: center;
      color: #796f80;
      font-size: 12px;
      margin-top: 25px;
    }

    .welcome {
      text-align: center;
    }

    .welcome h2 {
      color: #e6a3cb;
      margin: 20px 0;
    }

    @media(max-width: 480px) {
      .container {
        padding: 25px 20px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="logo">NOCTURNE</div>
    <p class="subtitle">Your world. Your rules.</p>

    <div id="authArea">

      <div class="tabs">
        <button id="loginTab" class="active" type="button">
          Connexion
        </button>
        <button id="signupTab" type="button">
          Inscription
        </button>
      </div>

      <form id="loginForm">
        <h2>Heureuse de te revoir ♡</h2>

        <label>Adresse courriel</label>
        <input id="loginEmail" type="email"
          placeholder="ton@email.com" required>

        <label>Mot de passe</label>
        <input id="loginPassword" type="password"
          placeholder="Ton mot de passe" required>

        <span class="forgot" id="forgot">
          Mot de passe oublié ?
        </span>

        <button class="submit" type="submit">
          Se connecter
        </button>
      </form>

      <form id="signupForm" class="hidden">
        <h2>Rejoins Nocturne ♡</h2>

        <label>Ton pseudo</label>
        <input id="username" type="text"
          placeholder="Ton pseudo" minlength="3"
          maxlength="24" required>

        <label>Adresse courriel</label>
        <input id="signupEmail" type="email"
          placeholder="ton@email.com" required>

        <label>Mot de passe</label>
        <input id="signupPassword" type="password"
          placeholder="8 caractères minimum"
          minlength="8" required>

        <label>Confirmer le mot de passe</label>
        <input id="confirmPassword" type="password"
          placeholder="Confirme ton mot de passe" required>

        <button class="submit" type="submit">
          Créer mon compte
        </button>
      </form>

      <div id="message" class="message"></div>

    </div>

    <div id="welcomeArea" class="welcome hidden">
      <h2>Bienvenue sur Nocturne ♡</h2>
      <p id="welcomeText"></p>
      <button class="submit" id="logout" type="button">
        Se déconnecter
      </button>
    </div>

    <div class="footer">
      NOCTURNE © 2026 · Un univers à toi.
    </div>

  </main>

  <script type="module">
    import { createClient }
      from "https://esm.sh/@supabase/supabase-js@2";

    const configResponse = await fetch("/api/config");
    const config = await configResponse.json();

    if (!config.supabaseUrl || !config.supabaseKey) {
      throw new Error("Configuration Supabase manquante.");
    }

    const supabase = createClient(
      config.supabaseUrl,
      config.supabaseKey
    );

    const loginTab = document.getElementById("loginTab");
    const signupTab = document.getElementById("signupTab");
    const loginForm = document.getElementById("loginForm");
    const signupForm = document.getElementById("signupForm");
    const message = document.getElementById("message");

    function showMessage(text) {
      message.textContent = text;
      message.style.display = "block";
    }

    function switchTab(signup) {
      loginForm.classList.toggle("hidden", signup);
      signupForm.classList.toggle("hidden", !signup);
      loginTab.classList.toggle("active", !signup);
      signupTab.classList.toggle("active", signup);
      message.style.display = "none";
    }

    loginTab.onclick = () => switchTab(false);
    signupTab.onclick = () => switchTab(true);

    loginForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      const email = document.getElementById("loginEmail").value;
      const password = document.getElementById("loginPassword").value;

      const { error } = await supabase.auth.signInWithPassword({
        email,
        password
      });

      if (error) {
        showMessage(error.message);
      }
    });

    signupForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      const username =
        document.getElementById("username").value.trim();

      const email =
        document.getElementById("signupEmail").value;

      const password =
        document.getElementById("signupPassword").value;

      const confirmation =
        document.getElementById("confirmPassword").value;

      if (password !== confirmation) {
        showMessage("Les deux mots de passe ne correspondent pas.");
        return;
      }

      const { data, error } = await supabase.auth.signUp({
        email,
        password,
        options: {
          data: { username },
          emailRedirectTo: window.location.origin
        }
      });

      if (error) {
        showMessage(error.message);
        return;
      }

      if (data.session) {
        showMessage("Ton compte est créé ! Bienvenue sur Nocturne.");
      } else {
        showMessage(
          "Un courriel de confirmation t'a été envoyé. Vérifie ta boîte de réception."
        );
      }
    });

    document.getElementById("forgot").onclick = async () => {
      const email = document.getElementById("loginEmail").value;

      if (!email) {
        showMessage("Entre d'abord ton adresse courriel.");
        return;
      }

      const { error } =
        await supabase.auth.resetPasswordForEmail(email, {
          redirectTo: window.location.origin
        });

      showMessage(error
        ? error.message
        : "Si cette adresse possède un compte, un courriel de récupération sera envoyé."
      );
    };

    async function updateSession(session) {
      const authArea = document.getElementById("authArea");
      const welcomeArea = document.getElementById("welcomeArea");

      if (session) {
        authArea.classList.add("hidden");
        welcomeArea.classList.remove("hidden");

        const username =
          session.user.user_metadata?.username || session.user.email;

        document.getElementById("welcomeText").textContent =
          "Connectée en tant que " + username;
      } else {
        authArea.classList.remove("hidden");
        welcomeArea.classList.add("hidden");
      }
    }

    const { data: sessionData } =
      await supabase.auth.getSession();

    await updateSession(sessionData.session);

    supabase.auth.onAuthStateChange((_event, session) => {
      updateSession(session);
    });

    document.getElementById("logout").onclick = async () => {
      const { error } = await supabase.auth.signOut();

      if (error) showMessage(error.message);
    };
  </script>

</body>
</html>
